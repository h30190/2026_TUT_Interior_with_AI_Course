<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>【替換】計算機</title>
<style>
  :root { --line:#ddd; --ink:#222; --sub:#666; --ok:#1a7f4b; --bad:#b3261e; --bg:#faf9f7; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink);
         font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; line-height:1.7; }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.lead { margin:0 0 20px; color:var(--sub); font-size:14px; }
  section { background:#fff; border:1px solid var(--line); border-radius:8px;
            padding:14px 16px; margin-bottom:14px; }
  h2 { font-size:15px; margin:0 0 10px; }
  label { display:block; margin-bottom:10px; font-size:14px; }
  label span { display:block; color:var(--sub); font-size:12px; }
  input { width:100%; padding:10px; font-size:16px; border:1px solid var(--line);
          border-radius:6px; margin-top:4px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td { padding:5px 0; border-bottom:1px solid var(--line); }
  td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  .result { font-size:28px; font-weight:500; margin:4px 0; }
  .note { font-size:12px; color:var(--sub); }
  .test { font-size:13px; margin:4px 0; }
  .pass { color:var(--ok); } .fail { color:var(--bad); font-weight:500; }
</style>
</head>
<body>
<main>
  <h1>【替換】計算機</h1>
  <p class="lead">【替換】一句話說明這個工具算什麼、輸入什麼。</p>

  <section>
    <h2>現場量到的數字</h2>
    <label>長度（公尺）<span>【替換：說明從哪裡量】</span>
      <input id="sideA" type="number" value="4" step="0.1" min="0"></label>
    <label>寬度（公尺）<span>【替換】</span>
      <input id="sideB" type="number" value="3" step="0.1" min="0"></label>
  </section>

  <section>
    <h2>假設參數（可改）</h2>
    <label>每單位用料量<span>⚠ 預設 2，依廠商標示調整</span>
      <input id="rate" type="number" value="2" step="0.1" min="0.1"></label>
    <label>損耗率（%）<span>⚠ 預設 10</span>
      <input id="loss" type="number" value="10" step="1" min="0"></label>
  </section>

  <section>
    <h2>計算過程</h2>
    <table id="steps"></table>
  </section>

  <section>
    <h2>結果</h2>
    <div class="result" id="out">—</div>
    <p class="note">此為估算值，不是下單量。實際下單前請以現場複丈與廠商規格確認。</p>
  </section>

  <section>
    <h2>驗算</h2>
    <p class="test" id="t1">—</p>
    <p class="test" id="t2">—</p>
    <p class="note">固定檢查，開頁自動執行。顯示失敗代表公式或程式被改壞了，
      先重新手算公式，不要直接改測試數字。</p>
  </section>
</main>

<script>
function $(id) { return document.getElementById(id); }

function calc(i) {
  var 面積 = i.sideA * i.sideB;
  var 基本量 = 面積 * i.rate;
  var 含損耗 = 基本量 * (1 + i.loss / 100);
  return { 面積:面積, 基本量:基本量, 含損耗:含損耗, 建議購買:Math.ceil(含損耗) };
}

function read() {
  return { sideA:+$('sideA').value, sideB:+$('sideB').value,
           rate:+$('rate').value, loss:+$('loss').value };
}

function row(k, v) { return '<tr><td>' + k + '</td><td>' + v + '</td></tr>'; }

function render() {
  var i = read(), r = calc(i);
  $('steps').innerHTML =
    row('面積', i.sideA + ' × ' + i.sideB + ' = ' + r.面積.toFixed(2) + ' m²') +
    row('基本用量', r.面積.toFixed(2) + ' × ' + i.rate + ' = ' + r.基本量.toFixed(2)) +
    row('加計損耗 ' + i.loss + '%', r.含損耗.toFixed(2));
  $('out').textContent = r.建議購買 + ' 單位';
}

function mark(el, 通過, 說明) {
  el.className = 'test ' + (通過 ? 'pass' : 'fail');
  el.textContent = (通過 ? '通過' : '失敗') + '｜' + 說明;
}

function checkCalc(el) {
  var 輸入 = { sideA:4, sideB:3, rate:2, loss:10 };
  var 預期 = 27;
  var 實得 = calc(輸入).建議購買;
  mark(el, 實得 === 預期,
       '公式檢查：4×3、每單位 2、損耗 10% → 預期 ' + 預期 + '，實得 ' + 實得);
}

function checkRender(el) {
  var 文字 = $('steps').textContent + $('out').textContent;
  mark(el, 文字.indexOf('NaN') === -1 && $('out').textContent !== '—',
       '畫面渲染檢查：輸入欄有接到計算函式，畫面結果非 NaN');
}

document.querySelectorAll('input').forEach(function (el) { el.addEventListener('input', render); });
render();
checkCalc($('t1'));
checkRender($('t2'));
</script>
</body>
</html>

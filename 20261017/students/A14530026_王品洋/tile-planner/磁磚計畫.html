<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>磁磚計畫產生器</title>
<style id="appstyle">:root{--bg:#f6f5f1;--card:#fff;--ink:#1e2430;--mute:#6a7280;--line:#e3e1da;--accent:#2f6f9f;--good:#2f9e6b;--goodbg:#e4f4ec;--bad:#d64545;--badbg:#fbe9e9;--warn:#b26a00;--warnbg:#fff4dd}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--ink:#e8ebf0;--mute:#98a1b0;--line:#2c323c;--accent:#7fb0e6;--good:#4cc38a;--goodbg:#173026;--bad:#ff7070;--badbg:#3a1f1f;--warn:#f0b35a;--warnbg:#3a2f14}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","Noto Sans TC","PingFang TC",system-ui,sans-serif;line-height:1.55;font-size:14px}
header.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
header.top h1{font-size:18px;margin:0 12px 0 0}
header.top button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
header.top button:hover{border-color:var(--accent)}header.top .pri{background:var(--accent);color:#fff;border-color:var(--accent)}
#status{margin-left:auto;color:var(--mute);font-size:13px}
.layout{display:grid;grid-template-columns:minmax(360px,440px) 1fr;gap:16px;padding:16px;max-width:1700px;margin:0 auto}
@media (max-width:1000px){.layout{grid-template-columns:1fr}}
#form{max-height:calc(100vh - 80px);overflow:auto;position:sticky;top:64px;align-self:start;padding-right:4px}
@media (max-width:1000px){#form{position:static;max-height:none}}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:0}
summary{cursor:pointer;padding:10px 12px;font-weight:700}
details>div,details>p,details>.tw,details>button{margin:0 12px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:2px}
label.f.chk{flex-direction:row;align-items:center;gap:6px;color:var(--ink)}
input[type=number],input[type=text],input:not([type]),select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input[readonly]{opacity:.7}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.hint{color:var(--mute);font-size:12px}
.tw{overflow:auto}
table.in{border-collapse:collapse;width:100%;font-size:12px}
table.in th{color:var(--mute);font-weight:600;text-align:left;padding:2px 3px;white-space:nowrap}
table.in td{padding:2px 3px}
table.in input,table.in select{padding:4px 5px;min-width:52px}
button.add{margin-top:2px;border:1px dashed var(--line);background:transparent;color:var(--accent);border-radius:6px;padding:4px 10px;cursor:pointer}
button.x{border:none;background:transparent;color:var(--bad);cursor:pointer;font-size:14px}
.errbox{background:var(--badbg);color:var(--bad);border:1px solid var(--bad);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.errbox ul{margin:6px 0 0 18px;padding:0}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:16px}
.sec h2{margin:0 0 8px;font-size:20px;border-bottom:2px solid var(--accent);padding-bottom:4px}
.sec h3{margin:18px 0 6px;font-size:15px}
.sec.small{font-size:12.5px;color:var(--mute)}
table{border-collapse:collapse;width:100%;font-size:13px;margin:4px 0}
table th,table td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table th{background:var(--bg);font-weight:600}
table.cmp td:first-child{width:130px;text-align:center}
.tag{display:inline-block;font-size:11px;padding:0 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.tag.good{background:var(--goodbg);color:var(--good);border-color:var(--good)}.tag.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.figbox{margin:8px 0;text-align:center}.figbox svg.fig{max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.figbox.small svg{max-width:440px}
.thumb{max-width:110px;height:auto;border:1px solid var(--line)}
.start{background:var(--warnbg);border-left:4px solid #d62828;padding:8px 12px;margin:4px 0}
.note{color:var(--mute);font-size:12.5px}
ul.warn li{color:var(--warn);margin:4px 0}ul.deduct{font-size:13px;color:var(--mute)}
.wallblock{border-top:1px dashed var(--line);margin-top:14px}
#v3box canvas{width:100%;max-width:900px;height:auto;aspect-ratio:3/2;border:1px solid var(--line);border-radius:8px;cursor:grab;background:#f6f5f1;display:block}
.hide{display:none}.v3ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0;font-size:13px}
@media print{
  header.top,#form,#errors,.v3ctl{display:none!important}.layout{display:block;padding:0}.sec{break-inside:avoid-page;border:none;padding:0;margin-bottom:10px}
  .figbox svg.fig{border:none}body{background:#fff}
}
body.standalone .doc{max-width:960px;margin:0 auto;padding:16px}body.standalone h1{font-size:22px}

.hl{background:#fff6e0;border:2px solid #e0a020;border-radius:8px;padding:8px 10px;margin-bottom:10px}
.hl .hint{margin:4px 0 0}

.v3sec{margin:8px 0;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px}
.v3sec button{padding:3px 10px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer}
</style>
</head>
<body>
<header class="top">
  <h1>磁磚計畫產生器</h1>
  <button id="btnSample">載入範例</button>
  <button id="btnSave">存專案 JSON</button>
  <label class="btn">載入 JSON<input type="file" id="fileLoad" accept=".json,application/json" hidden></label>
  <button id="btnHtml" class="pri">下載建議書（HTML）</button>
  <button id="btnPng">下載 3D 圖</button>
  <button id="btnPrint">列印／存成 PDF</button>
  <span id="status"></span>
</header>
<div class="layout">
  <div id="form"></div>
  <div>
    <div id="errors"></div>
    <div id="report"></div>
  </div>
</div>
<div id="v3box" class="hide">
  <div class="v3ctl"><b>顯示牆面：</b>
    <label><input type="checkbox" data-wall3d="N" checked> 北</label><label><input type="checkbox" data-wall3d="E" checked> 東</label>
    <label><input type="checkbox" data-wall3d="S" checked> 南</label><label><input type="checkbox" data-wall3d="W" checked> 西</label>
    <label style="margin-left:12px"><input type="checkbox" data-xray checked> <b>牆體透視（看牆厚、管道）</b></label>
    <span class="hint">面向鏡頭的牆會自動隱藏，方便看室內；拖曳旋轉、滾輪縮放。</span></div>
  <canvas id="cv3d" width="900" height="600"></canvas>
  <div class="v3sec"><b>洩水剖面線：</b>
    <label><input type="radio" name="secAxis" value="x" checked> 縱剖（北→南）</label>
    <label><input type="radio" name="secAxis" value="y"> 橫剖（西→東）</label>
    <input type="range" id="secPos" min="0" max="100" step="0.5" value="0" style="width:240px"> <b id="secVal"></b>
    <button type="button" id="secDrain">對準落水孔</button>
    <label style="margin-left:10px">3D 地面高程放大 ×<input type="number" id="secK" min="1" max="50" step="1" value="10" style="width:64px"></label> <span id="kMsg" class="hint" style="color:#c0392b"></span>
    <span class="hint">也可按住 Shift 在 3D 畫面左右拖曳來移動剖面線。</span></div>
  <div id="secProf" class="figbox"></div>
</div>
<script>/* 磁磚計畫計算核心：純函式，不碰 DOM，Node 與瀏覽器都能跑。
   單位一律 cm（面積輸出 m²）。座標：房間西北角（粗胚面）為原點，x 往東、y 往南；
   牆面座標 u 沿牆（北南牆從西端、東西牆從北端量起）、z 從結構樓板往上。
   固定規則（業主指定）：磁磚縫 0.2cm、黏著劑厚 0.5cm。 */
'use strict';
(function (root) {

var JOINT = 0.2;        // cm，磁磚縫（固定）
var ADH = 0.5;          // cm，黏著劑厚度（固定）
var EPS = 1e-6;
var WALLS = ['N', 'E', 'S', 'W'];
var WALL_ZH = { N: '北牆', E: '東牆', S: '南牆', W: '西牆' };

/* ---------------------------------------------------------------- 幾何 */
function polyArea(p) {
  var s = 0, i, a, b;
  for (i = 0; i < p.length; i++) { a = p[i]; b = p[(i + 1) % p.length]; s += a[0] * b[1] - b[0] * a[1]; }
  return Math.abs(s) / 2;
}

function clipHalf(poly, axis, val, keepGE) {
  var out = [], n = poly.length, i, a, b, ain, bin, t;
  for (i = 0; i < n; i++) {
    a = poly[i]; b = poly[(i + 1) % n];
    ain = keepGE ? a[axis] >= val - 1e-12 : a[axis] <= val + 1e-12;
    bin = keepGE ? b[axis] >= val - 1e-12 : b[axis] <= val + 1e-12;
    if (ain) { out.push(a); }
    if (ain !== bin) {
      t = (val - a[axis]) / (b[axis] - a[axis]);
      out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
    }
  }
  return out;
}

/* 凸多邊形 ∩ 軸向矩形 r=[x0,y0,x1,y1] */
function clipRect(poly, r) {
  var p = clipHalf(poly, 0, r[0], true);
  if (p.length) { p = clipHalf(p, 0, r[2], false); }
  if (p.length) { p = clipHalf(p, 1, r[1], true); }
  if (p.length) { p = clipHalf(p, 1, r[3], false); }
  return p;
}

function bboxOf(rects) {
  var b = [Infinity, Infinity, -Infinity, -Infinity];
  rects.forEach(function (r) {
    b[0] = Math.min(b[0], r[0]); b[1] = Math.min(b[1], r[1]);
    b[2] = Math.max(b[2], r[2]); b[3] = Math.max(b[3], r[3]);
  });
  return b;
}

function rectArea(r) { return Math.max(0, r[2] - r[0]) * Math.max(0, r[3] - r[1]); }
function interRect(a, b) {
  var r = [Math.max(a[0], b[0]), Math.max(a[1], b[1]), Math.min(a[2], b[2]), Math.min(a[3], b[3])];
  return (r[2] > r[0] && r[3] > r[1]) ? r : null;
}

/* ---------------------------------------------------------------- 排磚圖樣產生 */
/* 水平座標系：磚寬 tw 沿 x。pattern: stack／run2／run3 */
function genAxis(box, tw, th, pattern, ox, oy, j) {
  var px = tw + j, py = th + j, out = [], k, r, c, off, rmin, rmax, cmin, cmax, x, y;
  k = pattern === 'run2' ? 2 : (pattern === 'run3' ? 3 : 1);
  rmin = Math.floor((box[1] - oy) / py) - 1; rmax = Math.ceil((box[3] - oy) / py) + 1;
  for (r = rmin; r <= rmax; r++) {
    off = k > 1 ? (((r % k) + k) % k) * px / k : 0;
    cmin = Math.floor((box[0] - ox - off) / px) - 1; cmax = Math.ceil((box[2] - ox - off) / px) + 1;
    for (c = cmin; c <= cmax; c++) {
      x = ox + off + c * px; y = oy + r * py;
      if (x > box[2] || x + tw < box[0] || y > box[3] || y + th < box[1]) { continue; }
      out.push([[x, y], [x + tw, y], [x + tw, y + th], [x, y + th]]);
    }
  }
  return out;
}

function swapPoly(p) { return p.map(function (q) { return [q[1], q[0]]; }); }

/* 人字拼（90°）：磚長 ≈ m 倍磚寬（m≥2）。H 磚放在 (i-j) mod 2m == 0，V 磚放在 (i-j) mod 2m == 2m-1 */
function genHerring(box, L, S, ox, oy, j) {
  var s = S + j, m = Math.max(2, Math.round((L + j) / s)), len = m * s - j, out = [], i, k, imin, imax, jmin, jmax, d, x, y;
  imin = Math.floor((box[0] - ox) / s) - m - 1; imax = Math.ceil((box[2] - ox) / s) + 1;
  jmin = Math.floor((box[1] - oy) / s) - m - 1; jmax = Math.ceil((box[3] - oy) / s) + 1;
  for (i = imin; i <= imax; i++) {
    for (k = jmin; k <= jmax; k++) {
      d = (((i - k) % (2 * m)) + 2 * m) % (2 * m);
      x = ox + i * s; y = oy + k * s;
      if (d === 0) {
        if (x > box[2] || x + len < box[0] || y > box[3] || y + S < box[1]) { continue; }
        out.push([[x, y], [x + len, y], [x + len, y + S], [x, y + S]]);
      } else if (d === 2 * m - 1) {
        if (x > box[2] || x + S < box[0] || y > box[3] || y + len < box[1]) { continue; }
        out.push([[x, y], [x + S, y], [x + S, y + len], [x, y + len]]);
      }
    }
  }
  return out;
}

function genDiag(box, tw, th, ox, oy, j) {
  var ca = Math.SQRT1_2, sa = Math.SQRT1_2, px = tw + j, py = th + j, us = [], vs = [], out = [];
  var corners = [[box[0], box[1]], [box[2], box[1]], [box[2], box[3]], [box[0], box[3]]];
  corners.forEach(function (p) {
    var dx = p[0] - ox, dy = p[1] - oy;
    us.push(dx * ca + dy * sa); vs.push(-dx * sa + dy * ca);
  });
  var cmin = Math.floor(Math.min.apply(null, us) / px) - 1, cmax = Math.ceil(Math.max.apply(null, us) / px) + 1;
  var rmin = Math.floor(Math.min.apply(null, vs) / py) - 1, rmax = Math.ceil(Math.max.apply(null, vs) / py) + 1;
  var c, r, loc, u0, v0;
  function w(u, v) { return [ox + u * ca - v * sa, oy + u * sa + v * ca]; }
  for (c = cmin; c <= cmax; c++) {
    for (r = rmin; r <= rmax; r++) {
      u0 = c * px; v0 = r * py;
      loc = [w(u0, v0), w(u0 + tw, v0), w(u0 + tw, v0 + th), w(u0, v0 + th)];
      var xs = loc.map(function (q) { return q[0]; }), ys = loc.map(function (q) { return q[1]; });
      if (Math.min.apply(null, xs) > box[2] || Math.max.apply(null, xs) < box[0] ||
          Math.min.apply(null, ys) > box[3] || Math.max.apply(null, ys) < box[1]) { continue; }
      out.push(loc);
    }
  }
  return out;
}

/* method：'stack-h'｜'stack-v'｜'run2-h'｜'run2-v'｜'run3-h'｜'run3-v'｜'diag'｜'herring-h'｜'herring-v'
   h＝磚長邊沿水平（x）方向，v＝長邊沿垂直（y）方向 */
function genTiles(box, tile, method, origin, j) {
  var parts = method.split('-'), pattern = parts[0], orient = parts[1] || 'h';
  var L = Math.max(tile.w, tile.h), S = Math.min(tile.w, tile.h), polys;
  if (pattern === 'diag') { return genDiag(box, tile.w, tile.h, origin[0], origin[1], j); }
  if (pattern === 'herring') {
    if (orient === 'v') {
      return genHerring([box[1], box[0], box[3], box[2]], L, S, origin[1], origin[0], j).map(swapPoly);
    }
    return genHerring(box, L, S, origin[0], origin[1], j);
  }
  if (orient === 'v') {
    polys = genAxis([box[1], box[0], box[3], box[2]], L, S, pattern, origin[1], origin[0], j);
    return polys.map(swapPoly);
  }
  return genAxis(box, L, S, pattern, origin[0], origin[1], j);
}

/* 這個貼法下，磚的「寬（x）× 高（y）」尺寸（供計算起始點位移） */
function tileDims(tile, method) {
  var parts = method.split('-'), pattern = parts[0], orient = parts[1] || 'h';
  var L = Math.max(tile.w, tile.h), S = Math.min(tile.w, tile.h);
  if (pattern === 'diag') { return [tile.w, tile.h]; }
  if (pattern === 'herring') {
    var m = Math.max(2, Math.round((L + JOINT) / (S + JOINT))), len = m * (S + JOINT) - JOINT;
    return orient === 'v' ? [S, len] : [len, S];
  }
  return orient === 'v' ? [S, L] : [L, S];
}

/* ---------------------------------------------------------------- 排磚評估 */
/* regionRects：貼磚區（彼此不重疊的矩形）；holes：開孔矩形（落水孔、門窗、給水孔）
   回傳片數、整磚、切磚、開孔磚、最小切邊、細條切磚數、損耗，keepPolys 時附上畫圖用多邊形 */
function evalTiles(tiles, regionRects, holes, tile, keepPolys) {
  var tileArea = tile.w * tile.h, S = Math.min(tile.w, tile.h);
  var sliverMin = Math.max(4, 0.2 * S);
  var res = { pieces: 0, full: 0, cut: 0, holeCut: 0, slivers: 0, minCut: Infinity, used: 0, polys: [] };
  tiles.forEach(function (t) {
    var inRegion = 0, clippedAll = [], i, c, holeA = 0, a;
    regionRects.forEach(function (r) {
      c = clipRect(t, r);
      if (c.length >= 3) { a = polyArea(c); if (a > 1e-4) { inRegion += a; clippedAll.push(c); } }
    });
    if (inRegion < 0.05) { return; }
    holes.forEach(function (h) {
      var hc = clipRect(t, h);
      if (hc.length >= 3) { holeA += polyArea(hc); }
    });
    var usable = inRegion - holeA;
    if (usable < 0.05) { return; }           // 整片落在開孔內，不需要這片磚
    var isFull = (tileArea - usable) < 1e-6 * tileArea && holeA < 1e-9;
    var kind = isFull ? 'full' : (holeA > 1e-9 ? 'hole' : 'cut');
    res.pieces++; res.used += usable;
    if (kind === 'full') { res.full++; }
    else if (kind === 'hole') { res.holeCut++; }
    else {
      res.cut++;
      // 最小切邊：取貼磚區內那一塊的外框短邊
      var xs = [], ys = [];
      clippedAll.forEach(function (p) { p.forEach(function (q) { xs.push(q[0]); ys.push(q[1]); }); });
      var wd = Math.max.apply(null, xs) - Math.min.apply(null, xs), ht = Math.max.apply(null, ys) - Math.min.apply(null, ys);
      var md = Math.min(wd, ht);
      if (md < res.minCut) { res.minCut = md; }
      if (md < sliverMin - 1e-9) { res.slivers++; }
    }
    if (keepPolys) { res.polys.push({ pts: t, clipped: clippedAll, kind: kind }); }
  });
  if (res.minCut === Infinity) { res.minCut = null; }
  res.tileArea = tileArea;
  res.sliverMin = sliverMin;
  return res;
}

/* ---------------------------------------------------------------- 專案正規化／驗證 */
/* 沒給（undefined／null）才用預設值；給了但不是數字（例如表單空白）→ NaN，交給 validate 報錯，不可默默換成預設值 */
function num(v, d) { if (v === undefined || v === null) { return d; } var x = parseFloat(v); return isFinite(x) ? x : NaN; }
function fin(v) { return typeof v === 'number' && isFinite(v); }
function sv(v) { return fin(v) ? v : '未填'; }     // 訊息用：空白欄位顯示「未填」而不是 NaN
/* 深層複製，保留 NaN（JSON 複製會把 NaN 變成 null，空白欄位就會被預設值吃掉） */
function clone(o) {
  if (Array.isArray(o)) { return o.map(clone); }
  if (o && typeof o === 'object') { var c = {}; Object.keys(o).forEach(function (k) { c[k] = clone(o[k]); }); return c; }
  return o;
}

function defaultProject() {
  return {
    name: '範例浴室',
    room: { L: 180, D: 240, H: 270, wallT: { N: 15, E: 15, S: 15, W: 15 } },
    wallTop: 240,
    sequence: 'wallFirst',      // wallFirst＝先貼牆後貼地；floorFirst＝先貼地後貼牆
    corner: 'butt',             // butt＝長牆通到底、短牆被夾住；both＝每面牆兩端都扣
    wallTiled: { N: true, E: true, S: true, W: true },
    tiles: [
      { id: 'F1', name: '地磚 30×30 止滑', w: 30, h: 30, t: 9, perBox: 11, use: 'floor' },
      { id: 'F2', name: '地磚 30×60', w: 30, h: 60, t: 9, perBox: 6, use: 'floor' },
      { id: 'W1', name: '壁磚 30×60', w: 30, h: 60, t: 8.5, perBox: 6, use: 'wall' },
      { id: 'W2', name: '壁磚 25×40', w: 25, h: 40, t: 8, perBox: 12, use: 'wall' }

<script>/* 介面：表單 → 專案狀態 → 重新計算 → 顯示建議書／3D。計算都在 engine.js，這裡只做輸入輸出。 */

  setPath(S, path, v);
  if (/^tiles\.|floorTileId|wallTileId/.test(path)) {
    if (e.type === 'change') { renderForm(); }
  }
  schedule();
}

document.addEventListener('click', function (e) {

function recalc() {
  var t0 = performance.now(), res;
  try { res = E.computeAll(S); }
  catch (err) { res = { ok: false, errors: ['計算發生例外：' + err.message + '（請檢查輸入）'], warnings: [] }; }
  lastRes = res;
  var box = $('errors');
  if (!res.ok) {
    box.innerHTML = '<div class="errbox"><b>輸入有問題，先修正才能計算：</b><ul>' + res.errors.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul></div>';
    document.body.appendChild(v3); v3.classList.add('hide');
    $('report').innerHTML = ''; $('status').textContent = '輸入有誤'; if (viewer) { viewer.setResult(res); }
    return;
  }
  box.innerHTML = '';
  var html = RP.reportHTML(res);
  document.body.appendChild(v3); v3.classList.add('hide');
  $('report').innerHTML = html;
  var slot = $('slot3d');
  if (slot) { slot.appendChild(v3); v3.classList.remove('hide'); }
  if (viewer) { viewer.setResult(res); syncSec(); }
  $('status').textContent = '已計算（' + Math.round(performance.now() - t0) + ' ms）｜地面 ' + res.floor.pieces + ' 片、牆面 ' + res.wallTotal.pieces + ' 片';
}

/* ---------------------------------------------------------------- 匯出入 */
function download(name, mime, data) {
  var a = document.createElement('a'), blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function standaloneCSS() { var st = document.getElementById('appstyle'); return st ? st.textContent : ''; }

$('btnSample').addEventListener('click', function () { S = E.defaultProject(); renderForm(); recalc(); });
$('btnSave').addEventListener('click', function () { download((S.name || '磁磚計畫') + '.json', 'application/json', JSON.stringify(S, null, 2)); });
$('fileLoad').addEventListener('change', function (e) {
  var f = e.target.files[0]; if (!f) { return; }
  var rd = new FileReader();
  rd.onload = function () {
    try { var o = JSON.parse(rd.result); S = JSON.parse(JSON.stringify(E.normalize(o))); renderForm(); recalc(); }
    catch (err) { alert('讀取失敗：不是正確的專案 JSON（' + err.message + '）'); }
  };
  rd.readAsText(f); e.target.value = '';
});
$('btnPrint').addEventListener('click', function () { window.print(); });
$('btnPng').addEventListener('click', function () { if (!lastRes || !lastRes.ok) { return; } download((S.name || '磁磚計畫') + '-3D.png', 'image/png', dataURLtoBlob($('cv3d').toDataURL('image/png'))); });
$('btnHtml').addEventListener('click', function () {
  if (!lastRes || !lastRes.ok) { alert('輸入有誤，無法輸出建議書'); return; }
  var img = '<section class="sec"><h2>3D 模擬圖</h2><img style="max-width:100%" src="' + $('cv3d').toDataURL('image/png') + '"></section>';
  var body = RP.reportHTML(lastRes).replace(/<div id="slot3d"><\/div>/, '').replace(/<section class="sec" id="sec3d">[\s\S]*?<\/section>/, img);
  var doc = '<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>' + esc(S.name) + ' 磁磚計畫建議書</title><style>' + standaloneCSS() + '</style></head><body class="standalone"><main class="doc"><h1>' + esc(S.name) + '　磁磚計畫建議書</h1>' + body + '</main></body></html>';
  download((S.name || '磁磚計畫') + '-建議書.html', 'text/html', doc);
});
function dataURLtoBlob(u) {
  var p = u.split(','), mime = p[0].match(/:(.*?);/)[1], bin = atob(p[1]), n = bin.length, arr = new Uint8Array(n);
  while (n--) { arr[n] = bin.charCodeAt(n); }
  return new Blob([arr], { type: mime });
}
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.getAttribute && t.getAttribute('data-xray') !== null) { viewer.xray = t.checked; viewer.draw(); }
  if (t.getAttribute && t.getAttribute('data-wall3d')) {
    viewer.showWalls[t.getAttribute('data-wall3d')] = t.checked; viewer.draw();
  }
});

/* ---------------------------------------------------------------- 啟動 */
renderForm();
viewer = new D.Viewer3D($('cv3d'));
viewer.onSec = function () { var p = viewer.secPos(); $('secPos').value = p; $('secVal').textContent = (viewer.sec.axis === 'x' ? 'x = ' : 'y = ') + (Math.round(p * 10) / 10) + ' cm'; $('secProf').innerHTML = D.profileSVG(lastRes, viewer.sec.axis, p); };
document.addEventListener('input', function (e) { if (e.target.id === 'secPos') { syncSec('slider'); } else if (e.target.id === 'secK') { syncSec(); } });
document.addEventListener('change', function (e) { if (e.target.id === 'secK') { var v = parseFloat(e.target.value); e.target.value = isFinite(v) ? Math.max(1, Math.min(50, v)) : 10; syncSec(); } });
document.addEventListener('change', function (e) { if (e.target.name === 'secAxis') { syncSec('axis'); } });
$('secDrain').addEventListener('click', function () { syncSec('drain'); });
recalc();
window.__tile = { get viewer() { return viewer; }, get state() { return S; }, get result() { return lastRes; }, recalc: recalc, setState: function (o) { S = o; renderForm(); recalc(); } };
})();
</script>
</body>
</html>
